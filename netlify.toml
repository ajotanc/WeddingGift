# Configuration for Netlify Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://static.cloudflareinsights.com https://cdn.jsdelivr.net; connect-src 'self' https://api.ajotanc.com.br https://api.emailjs.com https://generativelanguage.googleapis.com https://*.trycloudflare.com https://api.ajotanc.com.br wss://api.ajotanc.com.br https://peer.ajotanc.com.br wss://peer.ajotanc.com.br https://nominatim.openstreetmap.org https://api.open-meteo.com; img-src 'self' data: blob: https://* https://api.ajotanc.com.br; media-src 'self' blob: data: https://* https://api.ajotanc.com.br; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://www.youtube-nocookie.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; manifest-src 'self' blob:; worker-src 'self' blob: https://cdn.jsdelivr.net;"

# Configuração para Single Page Application (SPA)
# Redireciona todas as rotas não encontradas para o index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
